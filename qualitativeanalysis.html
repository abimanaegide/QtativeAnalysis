<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qualitative Analysis Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .group-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .group-box {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 10px;
    }
    .highlight {
      background-color: yellow;
    }
    #notes {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Qualitative Analysis Tool</h1>
  <div class="group-container">
    <div class="group-box">
      <h3>Group 1</h3>
      <textarea id="group1"></textarea>
    </div>
    <div class="group-box">
      <h3>Group 2</h3>
      <textarea id="group2"></textarea>
    </div>
    <div class="group-box">
      <h3>Group 3</h3>
      <textarea id="group3"></textarea>
    </div>
  </div>
  <button onclick="highlightText()">Highlight Selection</button>
  <input type="text" id="tag" placeholder="Enter tag/label" />
  <div id="notes"></div>

  <script>
    function highlightText() {
      const tag = document.getElementById('tag').value;
      const notesDiv = document.getElementById('notes');
      const selected = window.getSelection();
      const selectedText = selected.toString();

      if (!selectedText) {
        alert('Please select some text to highlight.');
        return;
      }

      const note = document.createElement('p');
      note.innerHTML = `<strong>Tag:</strong> ${tag} <br><strong>Quote:</strong> "${selectedText}"`;
      notesDiv.appendChild(note);
    }
  </script>
</body>
</html>
